spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:todo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:Zm9yLWRldmVsb3BtZW50LW9ubHktY2hhbmdlLW1lLWltbWVkaWF0ZWx5LXNlY3JldA==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
